compute_profile: local  # local | cloud-gpu
model: facebook/wav2vec2-conformer-rope-large-960h-ft

eval:
  dataset: openslr/librispeech_asr
  config: clean
  split: validation          # dev evaluation subset
  subset_size: 256
  seed: 42
  decoding: greedy           # greedy CTC only (no LM)
  # Text normalization (lowercase + strip punctuation) is unconditional and
  # part of the pinned protocol; it is not configurable by design.
