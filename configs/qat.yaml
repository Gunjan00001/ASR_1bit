# Quantization-aware training config (Phase 11, cloud-gpu profile).
#
# NOT EXECUTED in this checkpoint. Provided so Phase 11 inherits the exact
# layer selection and quantization settings from binary.yaml.
extends: binary.yaml

compute_profile: cloud-gpu  # QAT trains on the cloud-gpu profile

training:
  freeze_feature_extractor: true
  learning_rate: 2.0e-05
  epochs: null               # set per experiment
  train_subset: null         # fixed subset id, recorded in results
