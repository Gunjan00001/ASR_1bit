[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "onebit-asr"
version = "1.6.0"
description = "One-bit Wav2Vec2-Conformer ASR experiments"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
demo = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "websockets>=12,<16",
  "python-multipart>=0.0.9",
  "soundfile>=0.12",
  "torchaudio>=2.0",
  "jiwer>=3.0",
]
